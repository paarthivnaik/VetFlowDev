name: VetFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend Pipeline ───────────────────────────────────────────────────────
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/VetFlow.sln

      - name: Build solution
        run: dotnet build backend/VetFlow.sln --no-restore --configuration Release

      - name: Run tests
        run: >-
          dotnet test backend/VetFlow.sln
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/test-results.trx'
          retention-days: 7

  # ─── Frontend Pipeline ──────────────────────────────────────────────────────
  frontend:
    name: Frontend (Angular 22 PWA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vetflow-pwa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/vetflow-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/vetflow-pwa/dist/
          retention-days: 7

  # ─── Verification Gate ──────────────────────────────────────────────────────
  ci-success:
    name: CI Quality Gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm CI success
        run: echo "All backend and frontend CI checks passed successfully."
