services:

  # ── Keycloak Identity Provider ───────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: vetflow-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    networks:
      - vetflow-net

  # ── PostgreSQL (CI/Staging/Prod provider — also available for local integration tests) ──
  postgres:
    image: postgres:16-alpine
    container_name: vetflow-postgres
    environment:
      POSTGRES_DB: vetflow_platform
      POSTGRES_USER: vetflow
      POSTGRES_PASSWORD: vetflow_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vetflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Object Storage ─────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: vetflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vetflow
      MINIO_ROOT_PASSWORD: vetflow_local_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - vetflow-net

  # ── MailHog (local email testing) ────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: vetflow-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - vetflow-net

volumes:
  keycloak_data:
  postgres_data:
  minio_data:

networks:
  vetflow-net:
    driver: bridge
