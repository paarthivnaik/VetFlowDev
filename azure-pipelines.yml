trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ─── Stage 1: Backend CI ───────────────────────────────────────────────────
  - stage: Backend
    displayName: 'Backend Build & Test'
    jobs:
      - job: DotNet_Build_Test
        displayName: '.NET 10 Pipeline'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '10.0.x'

          - script: dotnet restore backend/VetFlow.sln
            displayName: 'Restore NuGet packages'

          - script: dotnet build backend/VetFlow.sln --no-restore --configuration Release
            displayName: 'Build solution (Release)'

          - script: >-
              dotnet test backend/VetFlow.sln
              --no-build
              --configuration Release
              --logger "trx;LogFileName=test-results.trx"
              --collect:"XPlat Code Coverage"
            displayName: 'Execute unit and integration tests'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/test-results.trx'
              failTaskOnFailedTests: true

  # ─── Stage 2: Frontend CI ──────────────────────────────────────────────────
  - stage: Frontend
    displayName: 'Frontend Build & Test'
    jobs:
      - job: Angular_Build_Test
        displayName: 'Angular 22 PWA Pipeline'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js 24'
            inputs:
              versionSpec: '24.x'

          - script: npm ci
            workingDirectory: 'frontend/vetflow-pwa'
            displayName: 'Install npm packages'

          - script: npm run lint
            workingDirectory: 'frontend/vetflow-pwa'
            displayName: 'Execute ESLint'

          - script: npm test -- --watch=false
            workingDirectory: 'frontend/vetflow-pwa'
            displayName: 'Execute unit tests'

          - script: npm run build -- --configuration production
            workingDirectory: 'frontend/vetflow-pwa'
            displayName: 'Build production bundle'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish frontend bundle'
            inputs:
              PathtoPublish: 'frontend/vetflow-pwa/dist'
              ArtifactName: 'frontend-dist'
              publishLocation: 'Container'
